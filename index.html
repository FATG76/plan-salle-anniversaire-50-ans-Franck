<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trouver ma Table - Mariage de Gertie et Gallimard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      background-color: #f4f6f9;
      color: #333;
    }

    .layout {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
      align-items: flex-start;
    }

    .panneau {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      flex: 1;
      min-width: 320px;
    }

    .panneau-plan {
      flex: 1.5;
      min-width: 350px;
    }

    .layout > .panneau:not(.panneau-plan) {
      flex: 0 1 300px;
      min-width: 300px;
      max-width: 340px;
    }

    h1 {
      color: #2c3e50;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 24px;
    }

    h2 {
      color: #34495e;
      font-size: 18px;
      border-bottom: 2px solid #eee;
      padding-bottom: 8px;
      margin-top: 0;
    }

    input {
      padding: 12px;
      font-size: 16px;
      width: 100%;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      margin-bottom: 15px;
      outline: none;
    }

    input:focus {
      border-color: #006dc5;
    }

    .carte-resultat {
      background: #f8f9fa;
      border-left: 5px solid #006dc5;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .invite-selectionne-box {
      background: #e8f4fc;
      border: 2px solid #006dc5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .btn-action {
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: white;
    }

    .btn-select {
      background-color: #006dc5;
    }

    .btn-select:hover {
      background-color: #005f9e;
    }

    .svg-container {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
    }

    svg {
      width: 100%;
      height: auto;
      max-height: none;
      display: block;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    /* ==============================
       TABLES
       ============================== */

    .t {
      fill: #0078A7;
      stroke: #005a9e;
      stroke-width: 2;
      transition: all 0.3s ease;
    }

    .num,
    .compteur {
      display: none;
    }

    .lbl {
      font-family: Arial, sans-serif;
      font-size: 12px;
      fill: #222;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .box-lbl {
      fill: white;
      stroke: #333;
      stroke-width: 1.5;
    }

    /*
     * Nom de table affiché lors de la sélection.
     */
    .nom-table-svg {
      font-family: Arial, sans-serif;
      font-weight: bold;
      fill: #000000 !important;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .table-group {
      cursor: pointer;
    }

    /*
     * Table sélectionnée.
     */
    .table-group.active .t {
      fill: #f1c40f !important;
      stroke: #f39c12 !important;
      stroke-width: 3;
    }

    /*
     * Responsive tablette.
     */
    @media (max-width: 900px) {
      body {
        padding: 15px;
      }

      .layout {
        flex-direction: column;
      }

      .panneau-plan {
        order: 1;
        width: 100%;
        min-width: 0;
      }

      .panneau:not(.panneau-plan) {
        order: 2;
        width: 100%;
        min-width: 0;
      }

      .panneau {
        width: 100%;
      }
    }

    /*
     * Petit écran.
     */
    @media (max-width: 600px) {
      body {
        padding: 8px;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 12px;
      }

      .panneau {
        padding: 12px;
        border-radius: 10px;
      }

      .panneau-plan {
        padding: 8px;
      }

      h2 {
        font-size: 17px;
      }

      .carte-resultat {
        align-items: stretch;
        flex-direction: column;
      }

      .carte-resultat .btn-select {
        width: 100%;
        padding: 10px;
      }

      .invite-selectionne-box {
        padding: 12px;
      }

      svg {
        width: 100%;
        height: auto;
      }
    }

    /*
     * Très petit écran.
     */
    @media (max-width: 400px) {
      body {
        padding: 5px;
      }

      .panneau {
        padding: 10px;
      }

      .panneau-plan {
        padding: 5px;
      }

      h1 {
        font-size: 18px;
      }

      input {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<h1>Plan de la salle</h1>

<div class="layout">

  <!-- PANNEAU GAUCHE -->

  <div class="panneau">

    <h2>Trouver ma table</h2>

    <input
      type="text"
      id="recherche"
      placeholder="Tapez votre nom..."
      oninput="chercher()"
    >

    <div id="resultat"></div>

    <!-- INVITÉ SÉLECTIONNÉ -->

    <div
      id="zone-selection"
      style="display:none;"
      class="invite-selectionne-box"
    >

      <small style="color:#005f9e;font-weight:bold;">
        Invité sélectionné :
      </small>

      <div
        style="font-size:18px;font-weight:bold;margin:5px 0;"
        id="nom-invite-selectionne"
      ></div>

      <div
        style="color:#555;"
        id="table-invite-selectionne"
      ></div>

    </div>

  </div>


  <!-- PLAN -->

  <div class="panneau panneau-plan">

    <h2>Bienvenue au mariage de Gertie & Gallimard</h2>

    <div class="svg-container">

      <div id="svg-plan" class="svg-container"></div>

    </div>
  </div>

</div>


<script>

async function initialiserApplication() {
  try {
    const [donneesResponse, svgResponse] = await Promise.all([
      fetch('invites.json'),
      fetch('plan.svg')
    ]);

    if (!donneesResponse.ok || !svgResponse.ok) {
      throw new Error('Impossible de charger les fichiers de l’application.');
    }

    const donnees = await donneesResponse.json();
    nomsDesTables = donnees.nomsDesTables || {};
    donneesJSON = donnees.invites || {};

    document.getElementById('svg-plan').innerHTML = await svgResponse.text();

    initialiserTables();
  } catch (error) {
    console.error(error);
    document.getElementById('svg-plan').innerHTML =
      '<p style="color:#c0392b;font-weight:bold;">Erreur lors du chargement du plan ou des invités.</p>';
  }
}

let nomsDesTables = {};
let donneesJSON = {};
let inviteSelectionne = null;

function initialiserTables() {
  Object.keys(donneesJSON).forEach(key => {
    const tableNum = key.replace('Table ', '');
    const table = document.getElementById(`svg-table-${tableNum}`);

    if (table) {
      table.classList.remove('active');
    }
  });
}

function chercher() {
  const query = document.getElementById('recherche').value.toLowerCase().trim();
  const divResultat = document.getElementById('resultat');

  reinitialiserSelection();

  if (query === "") {
    divResultat.innerHTML = "";
    return;
  }

  let trouves = [];

  Object.keys(donneesJSON).forEach(key => {
    const tableNum = parseInt(key.replace('Table ', ''));
    const guests = donneesJSON[key];

    guests.forEach(nom => {
      if (nom.toLowerCase().includes(query)) {
        trouves.push({
          nom: nom,
          tableNum: tableNum
        });
      }
    });
  });

  if (trouves.length > 0) {
    divResultat.innerHTML = trouves.map(i => {
      const nomPerso = nomsDesTables[i.tableNum]
        ? `Table ${nomsDesTables[i.tableNum]}`
        : `Table`;

      return `
        <div class="carte-resultat">
          <div>
            <strong>${i.nom}</strong>
            <br>
            <small>${nomPerso}</small>
          </div>
          <button
            class="btn-action btn-select"
            onclick="selectionnerInvite('${i.nom.replace(/'/g, "\\'")}', ${i.tableNum})"
          >
            Voir ma table
          </button>
        </div>
      `;
    }).join("");
  } else {
    divResultat.innerHTML = "<p style='color:#7f8c8d;'>Aucun invité trouvé</p>";
  }
}

function selectionnerInvite(nom, tableNum) {
  inviteSelectionne = { nom: nom, tableNum: tableNum };

  document.getElementById('resultat').innerHTML = "";
  document.getElementById('nom-invite-selectionne').innerText = nom;
  document.getElementById('zone-selection').style.display = 'block';

  surlignerTable(tableNum);
}

function reinitialiserSelection() {
  inviteSelectionne = null;

  document.getElementById('zone-selection').style.display = 'none';

  document.querySelectorAll('.table-group').forEach(el => {
    el.classList.remove('active');
  });

  document.querySelectorAll('.nom-table-svg').forEach(el => el.remove());
}

function surlignerTable(tableNum) {
  const el = document.getElementById(`svg-table-${tableNum}`);
  if (!el) return;

  document.querySelectorAll('.nom-table-svg').forEach(t => t.remove());

  el.classList.add('active');

  const circle = el.querySelector('circle');
  if (!circle) return;

  const numText = document.getElementById(`svg-num-${tableNum}`);
  const subtext = document.getElementById(`svg-sub-${tableNum}`);

  if (numText) numText.textContent = '';
  if (subtext) subtext.textContent = '';

  const cx = parseFloat(circle.getAttribute('cx'));
  const cy = parseFloat(circle.getAttribute('cy'));
  const radius = parseFloat(circle.getAttribute('r'));

  const nomTable = nomsDesTables[tableNum] || `Table`;

  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  function largeurTexte(texte, taille) {
    ctx.font = `bold ${taille}px Arial`;
    return ctx.measureText(texte).width;
  }

  const largeurDisponible = radius * 2 - 8;
  const mots = nomTable.trim().split(/\s+/);
  const candidats = [];

  candidats.push([nomTable]);

  if (mots.length >= 2) {
    for (let i = 1; i < mots.length; i++) {
      candidats.push([
        mots.slice(0, i).join(' '),
        mots.slice(i).join(' ')
      ]);
    }
  }

  if (mots.length >= 3) {
    for (let i = 1; i < mots.length - 1; i++) {
      for (let j = i + 1; j < mots.length; j++) {
        candidats.push([
          mots.slice(0, i).join(' '),
          mots.slice(i, j).join(' '),
          mots.slice(j).join(' ')
        ]);
      }
    }
  }

  let meilleur = null;

  candidats.forEach(lignes => {
    let tailleBase;
    if (lignes.length === 1) tailleBase = 9;
    else if (lignes.length === 2) tailleBase = 8.5;
    else tailleBase = 7.5;

    const largeurMax = Math.max(...lignes.map(l => largeurTexte(l, tailleBase)));
    const facteur = largeurMax > largeurDisponible ? largeurDisponible / largeurMax : 1;
    const taille = tailleBase * facteur;

    if (taille < 5) return;

    const longueurs = lignes.map(l => l.length);
    const ecart = Math.max(...longueurs) - Math.min(...longueurs);
    const score = taille - ecart * 0.008 - (lignes.length - 1) * 0.05;

    if (!meilleur || score > meilleur.score) {
      meilleur = { lignes: lignes, taille: taille, score: score };
    }
  });

  if (!meilleur) {
    meilleur = { lignes: [nomTable], taille: 5, score: 0 };
  }

  const texte = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  texte.setAttribute('class', 'nom-table-svg');
  texte.setAttribute('x', cx);
  texte.setAttribute('y', cy);
  texte.setAttribute('text-anchor', 'middle');
  texte.setAttribute('dominant-baseline', 'middle');
  texte.setAttribute('font-family', 'Arial, sans-serif');
  texte.setAttribute('font-weight', 'bold');
  texte.setAttribute('font-size', meilleur.taille.toFixed(1));
  texte.setAttribute('fill', '#000');
  texte.setAttribute('pointer-events', 'none');

  let positions;
  if (meilleur.lignes.length === 1) {
    positions = [cy];
  } else if (meilleur.lignes.length === 2) {
    const ecart = Math.max(4.5, meilleur.taille * 0.62);
    positions = [cy - ecart, cy + ecart];
  } else {
    const ecart = Math.max(4.5, meilleur.taille * 0.85);
    positions = [cy - ecart, cy, cy + ecart];
  }

  meilleur.lignes.forEach((ligne, index) => {
    const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
    tspan.setAttribute('x', cx);
    tspan.setAttribute('y', positions[index]);
    tspan.setAttribute('text-anchor', 'middle');

    const largeur = largeurTexte(ligne, meilleur.taille);
    if (largeur > largeurDisponible) {
      tspan.setAttribute('textLength', largeurDisponible.toFixed(1));
      tspan.setAttribute('lengthAdjust', 'spacingAndGlyphs');
    }

    tspan.textContent = ligne;
    texte.appendChild(tspan);
  });

  el.appendChild(texte);

  const nomLibelle = nomsDesTables[tableNum]
    ? `Table ${nomsDesTables[tableNum]}`
    : `Table`;

  document.getElementById('table-invite-selectionne').innerText = `${nomLibelle}`;
}

document.addEventListener('DOMContentLoaded', initialiserApplication);
</script>

</body>
</html>
