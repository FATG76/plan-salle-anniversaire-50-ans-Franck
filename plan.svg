 <defs>
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="#d6dce1" stroke-width="1"/></pattern>
  <style>
   .t{fill:#0078A7;stroke:#005a9e;stroke-width:2;transition:all .3s ease}
   .num{display:none}
   .compteur{display:none}
   .lbl{font-family:Arial,sans-serif;font-size:12px;fill:#222;text-anchor:middle;dominant-baseline:central}
   .box-lbl{fill:white;stroke:#333;stroke-width:1.5}
   .table-group{cursor:pointer}
   .table-group.active .t{fill:#f1c40f!important;stroke:#f39c12!important;stroke-width:3}
   .table-group.complete .t{fill:#2ecc71!important;stroke:#27ae60!important}
  </style>
 </defs>
