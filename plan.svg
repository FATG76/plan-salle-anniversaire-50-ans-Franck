<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">

<defs>

  <!-- Dégradé bleu des tables normales -->
  <radialGradient id="tableGrad">
    <stop offset="0%" stop-color="#2EA8D7"/>
    <stop offset="100%" stop-color="#0078A7"/>
  </radialGradient>

  <!-- Ombre -->
  <filter id="shadow">
    <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.25"/>
  </filter>

  <!-- Flèche entrée -->
  <marker id="arrowhead"
          markerWidth="10"
          markerHeight="7"
          refX="10"
          refY="3.5"
          orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#E74C3C"/>
  </marker>

</defs>


<style>

/* ================================
   TABLE NORMALE
================================ */

.t {
    fill: url(#tableGrad);
    stroke: #005A9E;
    stroke-width: 3;
    filter: url(#shadow);
}


/* ================================
   TABLE SÉLECTIONNÉE
   JavaScript ajoute:
   class="table-group active"
================================ */

.table-group.active .t {
    fill: #D4A017 !important;
    stroke: #8A6500 !important;
    stroke-width: 4;
}


/* ================================
   NUMÉRO DE TABLE
================================ */

.num {
    fill: white;
    font-family: Segoe UI, Arial, sans-serif;
    font-size: 18px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
}


/* ================================
   NOM DE TABLE
   Utilisé dynamiquement par JS
================================ */

.nom-table-svg {
    fill: white;
    font-family: Segoe UI, Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
    pointer-events: none;
}


/* ================================
   LABELS
================================ */

.label {
    font-family: Segoe UI, Arial, sans-serif;
    font-weight: bold;
    fill: #222;
    font-size: 28px;
}


.label-entree {
    font-family: Segoe UI, Arial, sans-serif;
    font-weight: bold;
    fill: #E74C3C;
    font-size: 22px;
}

</style>


<!-- =================================
     CONTOUR DE LA SALLE
================================= -->

<rect
    x="10"
    y="10"
    width="1380"
    height="880"
    fill="#fafafa"
    stroke="#444"
    stroke-width="2"
/>


<!-- =================================
     BUFFET 1
================================= -->

<rect
    x="40"
    y="80"
    width="200"
    height="50"
    fill="white"
    stroke="#555"
/>

<text
    x="140"
    y="115"
    text-anchor="middle"
    class="label">
    BUFFET 1
</text>


<!-- =================================
     BUFFET 2
================================= -->

<rect
    x="40"
    y="750"
    width="200"
    height="50"
    fill="white"
    stroke="#555"
/>

<text
    x="140"
    y="785"
    text-anchor="middle"
    class="label">
    BUFFET 2
</text>


<!-- =================================
     ARCHE
================================= -->

<path
    d="M1210 60 A180 180 0 0 1 1390 240"
    fill="none"
    stroke="#444"
    stroke-width="3"
/>

<text
    x="1230"
    y="90"
    class="label">
    ARCHE
</text>


<!-- =================================
     FRANCK
================================= -->

<rect
    x="1260"
    y="270"
    width="65"
    height="180"
    fill="white"
    stroke="#444"
/>

<text
    transform="rotate(90 1292 360)"
    x="1292"
    y="360"
    text-anchor="middle"
    class="label">
    FRANCK
</text>


<!-- =================================
     ALLÉE BLEU CIEL
================================= -->

<path
    d="M460 845 L460 470 L840 470"
    fill="none"
    stroke="#D9E6F2"
    stroke-width="90"
    stroke-linecap="square"
/>


<!-- =================================
     PISTE DE DANSE
================================= -->

<rect
    x="840"
    y="380"
    width="220"
    height="180"
    rx="12"
    fill="#E8EEF5"
    stroke="#95A5A6"
/>

<text
    x="950"
    y="452"
    text-anchor="middle"
    class="label"
    font-size="26">
    PISTE
</text>

<text
    x="950"
    y="498"
    text-anchor="middle"
    class="label"
    font-size="26">
    DE DANSE
</text>


<!-- =================================
     ENTRÉE
================================= -->

<g transform="translate(442, 785) rotate(-90)">
    <text
        x="0"
        y="0"
        text-anchor="middle"
        class="label-entree">
        ENTRÉE
    </text>
</g>

<path
    d="M470 875 L470 670"
    stroke="#E74C3C"
    stroke-width="6"
    fill="none"
    marker-end="url(#arrowhead)"
/>


<!-- =================================
     DJ
================================= -->

<g transform="translate(1240 760) rotate(-40)">

    <rect
        width="110"
        height="60"
        fill="white"
        stroke="#444"
    />

    <text
        x="55"
        y="40"
        text-anchor="middle"
        class="label">
        DJ
    </text>

</g>


